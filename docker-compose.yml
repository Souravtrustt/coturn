services:
  coturn:
    build:
      context: .
      dockerfile: docker/coturn/debian/Dockerfile
    image: coturn-local
    # coturn-local only ever exists locally (built from build: above) -
    # never attempt to pull it from a registry, e.g. on `docker compose up`
    # without --build.
    pull_policy: build
    container_name: coturn
    restart: unless-stopped
    # coturn logs to stdout only (log-file=stdout in turnserver.conf) and
    # this redirects that into a file on a host-mounted volume, rotated by
    # the host's logrotate - same approach as the livekit-server compose
    # service. The image's own ENTRYPOINT (docker-entrypoint.sh) is bypassed
    # since it only adds argument-expansion we don't need; `exec` puts
    # turnserver itself at PID 1 so it receives SIGTERM directly instead of
    # sh swallowing it and turnserver getting SIGKILLed after the compose
    # stop grace period.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec turnserver -c /etc/coturn/turnserver.conf >> /apps/applogs/common/turnserver.log 2>&1
    volumes:
      - /etc/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /apps/applogs/common:/apps/applogs/common
    ports:
      # STUN/TURN
      - "3478:3478"
      - "3478:3478/udp"
      # STUN/TURN over TLS/DTLS
      - "5349:5349"
      - "5349:5349/udp"
      # Relay ports - uncomment and narrow the range to what you actually
      # need (min-port/max-port in turnserver.conf), a full 49152-65535
      # publish is slow to start and binds a huge range on the host.
      # - "49152-65535:49152-65535"
      # - "49152-65535:49152-65535/udp"
    # small cap: only catches crash output before the log file above takes
    # over - the real log lives in /apps/applogs/common/turnserver.log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
